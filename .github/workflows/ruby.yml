name: Ruby

on:
  issues:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4.1.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6'
          bundler-cache: true

      - name: Run Rake
        run: bundle exec rake
        env:
          TOKEN: ${{ secrets.DUTY_TOKEN }}
          REPO: ${{ github.repository }}
